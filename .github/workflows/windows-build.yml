name: Windows build

on:
  workflow_dispatch:
    inputs:
      api_id:
        description: TDESKTOP_API_ID (my.telegram.org)
        required: false
        default: "2040"
      api_hash:
        description: TDESKTOP_API_HASH (my.telegram.org)
        required: false
        default: "b18441a1ff607e10a989891a5462e627"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Visual Studio ATL component
        shell: pwsh
        run: |
          $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer'
          $vswhere = Join-Path $installer 'vswhere.exe'
          $setup = Join-Path $installer 'setup.exe'
          if (-not (Test-Path $vswhere) -or -not (Test-Path $setup)) {
            throw "Visual Studio Installer is incomplete at $installer."
          }

          $toolsComponent = 'Microsoft.VisualStudio.Component.VC.14.44.17.14.x86.x64'
          $atlComponent = 'Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL'
          $path = @(& $vswhere -latest -products '*' -requires $toolsComponent -property installationPath)[0]
          if (-not $path) {
            throw "No Visual Studio instance provides $toolsComponent."
          }

          $toolset = Get-ChildItem (Join-Path $path 'VC\Tools\MSVC') -Directory `
            | Where-Object { $_.Name -like '14.44.*' } `
            | Sort-Object Name -Descending `
            | Select-Object -First 1
          if (-not $toolset) {
            throw "The selected Visual Studio instance has no 14.44 toolset."
          }
          $header = Join-Path $toolset.FullName 'atlmfc\include\atlbase.h'
          if (Test-Path $header) {
            Write-Host "ATL is already installed for $($toolset.Name)."
            exit 0
          }

          $process = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            'modify',
            '--installPath', "`"$path`"",
            '--add', $atlComponent,
            '--quiet', '--norestart', '--nocache'
          )
          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Visual Studio Installer exited with $($process.ExitCode)."
          }
          if (-not (Test-Path $header)) {
            throw "$atlComponent completed without installing $header."
          }

      - name: Windows SDK version
        shell: bash
        run: |
          SDK="$(grep "SDK version" docs/building-win.md | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          test -n "$SDK" || { echo "::error::SDK version not found in docs/building-win.md"; exit 1; }
          echo "SDK=$SDK" >> $GITHUB_ENV

      - uses: Eden-CI/msvc-dev-cmd@1bd71f95d6f3d1b2b3395b335cc63bcdc90cf223
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: "14.44"

      - name: Verify Visual Studio ATL component
        shell: pwsh
        run: |
          $atlInclude = Join-Path $env:VCToolsInstallDir 'atlmfc\include'
          $header = Join-Path $atlInclude 'atlbase.h'
          if (-not (Test-Path $header)) {
            throw "The selected toolset has no ATL header at $header."
          }
          if (($env:INCLUDE -split ';') -notcontains $atlInclude) {
            throw "The selected toolset did not add $atlInclude to INCLUDE."
          }

      - name: Patch cmake debug info flags
        shell: bash
        run: |
          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

      - name: NuGet sources
        shell: cmd
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      # Like tdesktop canary.yml: explicit restore/save instead of the
      # combined actions/cache, whose post-step save runs only on job
      # success; a failed app build would discard hours of prepare.
      - name: Restore libraries cache
        id: cache-libs
        uses: actions/cache/restore@v6
        with:
          path: |
            Libraries\win64
            ThirdParty
          key: win64-libs-release-v1-${{ env.SDK }}-${{ hashFiles('Telegram/build/prepare/win.bat', 'Telegram/build/prepare/prepare.py', 'Telegram/build/qt_version.py') }}
          restore-keys: |
            win64-libs-release-v1-

      - name: Prepare libraries
        run: Telegram\build\prepare\win.bat silent

      - name: Save libraries cache
        if: steps.cache-libs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            Libraries\win64
            ThirdParty
          key: ${{ steps.cache-libs.outputs.cache-primary-key }}

      # CMAKE_POLICY_DEFAULT_CMP0194=NEW: silences a dev warning from the
      # whisper.cpp/ggml submodule that -Werror=dev otherwise turns fatal.
      - name: Configure
        run: >
          Telegram\configure.bat x64
          -D TDESKTOP_API_ID=${{ inputs.api_id }}
          -D TDESKTOP_API_HASH=${{ inputs.api_hash }}
          -D CMAKE_POLICY_DEFAULT_CMP0194=NEW
          -D CMAKE_CONFIGURATION_TYPES=Release
          -D CMAKE_COMPILE_WARNING_AS_ERROR=OFF
          -D CMAKE_MSVC_DEBUG_INFORMATION_FORMAT=
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=OFF
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=OFF

      - name: Build
        run: cmake --build out --config Release -- /m

      - name: Package
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path out -Filter AyuGram.exe -Recurse -File | Select-Object -First 1
          if (-not $exe) { throw "AyuGram.exe not found under out\" }
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item $exe.FullName -Destination package\AyuGram.exe
          Compress-Archive -Path package\* -DestinationPath AyuGram-windows-x64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: AyuGram-windows-x64
          path: AyuGram-windows-x64.zip
