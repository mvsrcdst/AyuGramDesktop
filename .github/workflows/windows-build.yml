name: Windows build

on:
  workflow_dispatch:
    inputs:
      api_id:
        description: TDESKTOP_API_ID (my.telegram.org)
        required: false
        default: "2040"
      api_hash:
        description: TDESKTOP_API_HASH (my.telegram.org)
        required: false
        default: "b18441a1ff607e10a989891a5462e627"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: actions/cache@v6
        with:
          path: |
            Libraries\win64
            ThirdParty
          key: win64-libs-v1-${{ hashFiles('Telegram/build/prepare/win.bat', 'Telegram/build/prepare/prepare.py', 'Telegram/build/qt_version.py') }}
          restore-keys: |
            win64-libs-v1-

      - name: Link legacy ATL/MFC path
        shell: pwsh
        run: |
          $dst = Join-Path $env:VCINSTALLDIR "atlmfc"
          $legacyAtlHeader = Join-Path $dst "include\atlbase.h"
          $legacyAtlLib = Join-Path $dst "lib\x64\atls.lib"
          if ((Test-Path $legacyAtlHeader) -and (Test-Path $legacyAtlLib)) {
            Write-Host "ATL/MFC already present at $dst, skipping."
            exit 0
          }

          $toolsRoot = Join-Path $env:VCINSTALLDIR "Tools\MSVC"
          $candidates = Get-ChildItem -Path $toolsRoot -Directory -ErrorAction SilentlyContinue | Sort-Object Name -Descending
          Write-Host "Installed MSVC toolsets under $toolsRoot`: $($candidates.Name -join ', ')"

          $src = $null
          foreach ($c in $candidates) {
            $atlmfc = Join-Path $c.FullName "ATLMFC"
            $hasHeader = Test-Path (Join-Path $atlmfc "include\atlbase.h")
            $hasLib = Test-Path (Join-Path $atlmfc "lib\x64\atls.lib")
            Write-Host "  $($c.Name): header=$hasHeader lib=$hasLib"
            if ($hasHeader -and $hasLib) {
              $src = $atlmfc
              break
            }
          }
          if (-not $src) {
            throw "No installed MSVC toolset has a complete ATLMFC (headers + atls.lib); cannot create compat link."
          }

          if (Test-Path $dst) { Remove-Item $dst -Force -Recurse }
          New-Item -ItemType Junction -Path $dst -Target $src | Out-Null
          Write-Host "Created junction $dst -> $src"

      - name: Prepare libraries
        run: Telegram\build\prepare\win.bat

      - name: Configure
        run: >
          Telegram\configure.bat x64
          -D TDESKTOP_API_ID=${{ inputs.api_id }}
          -D TDESKTOP_API_HASH=${{ inputs.api_hash }}

      - name: Build
        run: cmake --build out --config Release -- /m

      - name: Package
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path out -Filter AyuGram.exe -Recurse -File | Select-Object -First 1
          if (-not $exe) { throw "AyuGram.exe not found under out\" }
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item $exe.FullName -Destination package\AyuGram.exe
          Compress-Archive -Path package\* -DestinationPath AyuGram-windows-x64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: AyuGram-windows-x64
          path: AyuGram-windows-x64.zip
