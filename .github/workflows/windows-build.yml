name: Windows build

on:
  workflow_dispatch:
    inputs:
      api_id:
        description: TDESKTOP_API_ID (my.telegram.org)
        required: false
        default: "2040"
      api_hash:
        description: TDESKTOP_API_HASH (my.telegram.org)
        required: false
        default: "b18441a1ff607e10a989891a5462e627"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: actions/cache@v6
        with:
          path: |
            Libraries\win64
            ThirdParty
          key: win64-libs-v1-${{ hashFiles('Telegram/build/prepare/win.bat', 'Telegram/build/prepare/prepare.py', 'Telegram/build/qt_version.py') }}
          restore-keys: |
            win64-libs-v1-

      - name: Install ATL/MFC (VC.ATLMFC)
        shell: pwsh
        run: |
          $legacyAtlHeader = Join-Path $env:VCINSTALLDIR "atlmfc\include\atlbase.h"
          if (Test-Path $legacyAtlHeader) {
            Write-Host "ATL/MFC already present at $legacyAtlHeader, skipping install."
            exit 0
          }
          $vsPath = (& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath).Trim()
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $proc = Start-Process -FilePath $installer -ArgumentList "modify --installPath `"$vsPath`" --add Microsoft.VisualStudio.Component.VC.ATLMFC --quiet --norestart --wait" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "vs_installer failed with exit code $($proc.ExitCode)" }

      - name: Prepare libraries
        run: Telegram\build\prepare\win.bat

      - name: Configure
        run: >
          Telegram\configure.bat x64
          -D TDESKTOP_API_ID=${{ inputs.api_id }}
          -D TDESKTOP_API_HASH=${{ inputs.api_hash }}

      - name: Build
        run: cmake --build out --config Release -- /m

      - name: Package
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path out -Filter AyuGram.exe -Recurse -File | Select-Object -First 1
          if (-not $exe) { throw "AyuGram.exe not found under out\" }
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item $exe.FullName -Destination package\AyuGram.exe
          Compress-Archive -Path package\* -DestinationPath AyuGram-windows-x64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: AyuGram-windows-x64
          path: AyuGram-windows-x64.zip
