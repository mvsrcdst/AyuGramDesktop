name: ggml GPU backend - Linux CUDA

# See ggml-backend-windows-cuda.yml for the general rationale. Same
# centos_env container as ggml-backend-linux-vulkan.yml (RockyLinux 8, for
# glibc ABI compatibility with older target distros - see
# docs/building-linux.md); Jimver/cuda-toolkit only supports apt/choco
# hosts, so the toolkit is installed via NVIDIA's official RHEL8 dnf repo
# instead. cuda-toolkit-12-4 tracks the latest 12.4.x point release rather
# than the exact 12.4.0 pinned on Windows - close enough for an
# ABI-stable GGML_BACKEND_DL module.

on:
  workflow_dispatch: {}
  push:
    branches: [dev]
    paths:
      - 'Telegram/ThirdParty/whisper.cpp'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/telegramdesktop/tdesktop/centos_env:latest
      options: --user root
    outputs:
      short-sha: ${{ steps.vars.outputs.short-sha }}
      full-sha: ${{ steps.vars.outputs.full-sha }}
      api-version: ${{ steps.vars.outputs.api-version }}
      whisper-version: ${{ steps.vars.outputs.version }}
      zip-name: ${{ steps.package.outputs.zip_path }}
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: |
            .github
            Telegram/ThirdParty/whisper.cpp

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Init whisper.cpp submodule
        run: git submodule update --init Telegram/ThirdParty/whisper.cpp

      - id: vars
        uses: ./.github/actions/resolve-whisper-vars

      - name: Install CUDA toolkit (manual, CentOS container)
        run: |
          dnf config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo
          dnf -y install cuda-nvcc-12-4 cuda-cudart-devel-12-4 libcublas-devel-12-4 cuda-driver-devel-12-4
          echo "CUDA_PATH=/usr/local/cuda-12.4" >> "$GITHUB_ENV"
          echo "/usr/local/cuda-12.4/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=/usr/local/cuda-12.4/lib64:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - name: Install CUDA-compatible host compiler
        run: dnf -y install gcc-toolset-13-gcc gcc-toolset-13-gcc-c++

      #   GGML_NATIVE=OFF - fat bin compilation (huge binary size).
      #   So we pin CMAKE_CUDA_ARCHITECTURES to only the GPU generations we
      #   actually want to support, instead of the wide default fallback list.
      #
      #   DCMAKE_CUDA_ARCHITECTURES:
      #   50 = Maxwell  (GTX 750/900)
      #   61 = Pascal   (GTX 10xx)
      #   75 = Turing   (RTX 20xx, GTX 16xx)
      #   86 = Ampere   (RTX 30xx)
      #   89 = Ada      (RTX 40xx)
      - name: Configure
        run: >
          cmake -S Telegram/ThirdParty/whisper.cpp -B build
          -DBUILD_SHARED_LIBS=ON
          -DGGML_BACKEND_DL=ON
          -DGGML_NATIVE=OFF
          -DCMAKE_CUDA_ARCHITECTURES="61;75;86;89"
          -DWHISPER_BUILD_TESTS=OFF
          -DWHISPER_BUILD_EXAMPLES=OFF
          -DCMAKE_BUILD_TYPE=Release
          -DGGML_CUDA=ON
          -DCMAKE_CUDA_HOST_COMPILER=/opt/rh/gcc-toolset-13/root/usr/bin/gcc
          -DCMAKE_BUILD_RPATH='$ORIGIN'
          -DCMAKE_INSTALL_RPATH='$ORIGIN'

      - name: Build
        run: cmake --build build --target ggml-cuda ggml-base -- -j"$(nproc)"

      - name: Package
        id: package
        run: |
          dnf install -y zip
          dest=package
          mkdir -p "$dest"
          find build -name "libggml-cuda.so" -exec cp {} "$dest/" \;
          find build -name "libggml-base.so" -exec cp {} "$dest/" \;
          cp -P "$CUDA_PATH"/lib64/libcublas.so.* "$dest/"
          cp -P "$CUDA_PATH"/lib64/libcublasLt.so.* "$dest/"
          zipName="ggml-cuda-linux-x64-${{ steps.vars.outputs.short-sha }}.zip"
          (cd "$dest" && zip "../$zipName" ./*)
          echo "zip_path=$zipName" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ggml-cuda-linux-x64
          path: ${{ steps.package.outputs.zip_path }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: ggml-manifest-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v8
        with:
          name: ggml-cuda-linux-x64

      - uses: ./.github/actions/publish-ggml-backend
        with:
          zip-path: ${{ needs.build.outputs.zip-name }}
          short-sha: ${{ needs.build.outputs.short-sha }}
          whisper-cpp-commit: ${{ needs.build.outputs.full-sha }}
          api-version: ${{ needs.build.outputs.api-version }}
          whisper-cpp-version: ${{ needs.build.outputs.whisper-version }}
