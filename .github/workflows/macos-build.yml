name: macOS build

on:
  workflow_dispatch:
    inputs:
      api_id:
        description: TDESKTOP_API_ID (my.telegram.org)
        required: false
        default: "2040"
      api_hash:
        description: TDESKTOP_API_HASH (my.telegram.org)
        required: false
        default: "b18441a1ff607e10a989891a5462e627"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Select newest available Xcode
        run: |
          latest=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n1)
          test -n "$latest" || latest=/Applications/Xcode.app
          sudo xcode-select -s "$latest/Contents/Developer"
          xcodebuild -version

      - name: Install build dependencies
        run: brew install automake cmake wget pkg-config gnu-tar ninja nasm meson

      - uses: actions/cache@v6
        with:
          path: |
            Libraries
            ThirdParty
          key: macos-libs-v1-${{ hashFiles('Telegram/build/prepare/mac.sh', 'Telegram/build/prepare/prepare.py', 'Telegram/build/qt_version.py') }}
          restore-keys: |
            macos-libs-v1-

      - name: Prepare libraries
        run: Telegram/build/prepare/mac.sh silent

      - name: Configure
        run: >
          Telegram/configure.sh
          -D TDESKTOP_API_ID=${{ inputs.api_id }}
          -D TDESKTOP_API_HASH=${{ inputs.api_hash }}
          -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_REQUIRED=NO
          -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO
          -D CMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=-

      - name: Build
        run: cmake --build out --config Release -- -jobs "$(sysctl -n hw.ncpu)"

      - name: Package
        run: |
          app=$(find out -maxdepth 4 -iname "AyuGram.app" -type d | head -n1)
          test -n "$app" || { echo "::error::AyuGram.app not found under out/"; exit 1; }
          dest=package
          mkdir -p "$dest"
          ditto "$app" "$dest/AyuGram.app"
          ditto -c -k --sequesterRsrc --keepParent "$dest/AyuGram.app" AyuGram-macos.zip

      - uses: actions/upload-artifact@v7
        with:
          name: AyuGram-macos
          path: AyuGram-macos.zip
